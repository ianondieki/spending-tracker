# Render Blueprint: API web service, worker, web viewer and a Postgres database. NOT deployed by the sprint; see
# README.md. Apply with "New → Blueprint" pointing at this file; secrets marked sync: false are entered in the
# dashboard and never live in the repo. Region: Render has no Nairobi or Johannesburg region; frankfurt is the closest.
databases:
  - name: hesabu-db
    plan: basic-256mb
    region: frankfurt
    databaseName: hesabu
    user: hesabu

services:
  - type: web
    name: hesabu-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: infra/deploy/Dockerfile.backend
    dockerContext: .
    dockerCommand: node api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: hesabu-db, property: connectionString }
      - { key: TZ, value: Africa/Nairobi }
      - { key: NODE_ENV, value: production }
      - { key: PORT, value: "8787" }
      - { key: AI_ENABLED, value: "false" }
      - { key: AI_DAILY_BUDGET_USD, value: "2" }
      - { key: REPORT_LINK_TTL_DAYS, value: "30" }
      - { key: WHATSAPP_API_VERSION, value: v21.0 }
      - { key: APP_BASE_URL, sync: false }           # the hesabu-web URL
      - { key: DEVICE_TOKEN_SECRET, sync: false }
      - { key: REPORT_LINK_SECRET, sync: false }
      - { key: WHATSAPP_VERIFY_TOKEN, sync: false }
      - { key: WHATSAPP_APP_SECRET, sync: false }
      - { key: RESEND_WEBHOOK_SECRET, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }

  - type: worker
    name: hesabu-worker
    runtime: docker
    region: frankfurt
    plan: standard                                   # Chromium for the renderer needs the memory
    dockerfilePath: infra/deploy/Dockerfile.backend
    dockerContext: .
    dockerCommand: node worker/dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: hesabu-db, property: connectionString }
      - { key: TZ, value: Africa/Nairobi }
      - { key: NODE_ENV, value: production }
      - { key: AI_ENABLED, value: "false" }
      - { key: AI_DAILY_BUDGET_USD, value: "2" }
      - { key: REPORT_LINK_TTL_DAYS, value: "30" }
      - { key: WHATSAPP_API_VERSION, value: v21.0 }
      - { key: APP_BASE_URL, sync: false }
      - { key: REPORT_LINK_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: RESEND_FROM, sync: false }
      - { key: WHATSAPP_TOKEN, sync: false }
      - { key: WHATSAPP_PHONE_NUMBER_ID, sync: false }
      - { key: S3_ENDPOINT, sync: false }            # all four S3_* or none (the worker refuses a partial set)
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY, sync: false }
      - { key: S3_SECRET_KEY, sync: false }
      - { key: S3_PUBLIC_BASE_URL, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }

  - type: web
    name: hesabu-web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: infra/deploy/Dockerfile.web
    dockerContext: .
    envVars:
      - { key: TZ, value: Africa/Nairobi }
      - { key: NODE_ENV, value: production }
      - { key: PORT, value: "3000" }
      - { key: API_BASE_URL, sync: false }           # the hesabu-api URL
