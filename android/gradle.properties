# Hesabu Android — project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# AndroidX is required by Compose and every Jetpack library used here.
android.useAndroidX=true
# Only the module's own resources go into its R class (smaller DEX, faster builds).
android.nonTransitiveRClass=true
kotlin.code.style=official
